name: Import Daily Dynasty source
on:
  workflow_dispatch:
  push:
    paths:
      - '.payload-part-*'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Daily Dynasty
        shell: bash
        run: |
          set -euo pipefail
          for i in {0..7}; do
            [[ -f ".payload-part-$i" ]] || { echo "Missing source part $i"; exit 1; }
          done
          cat .payload-part-{0..7} | base64 --decode > /tmp/daily-dynasty-source.tar.xz
          echo "0ae202971068875220d276e86a7b75a04238c72226906dee5a149ceb3002d097  /tmp/daily-dynasty-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/daily-dynasty-source.tar.xz
          # GitHub Actions tokens cannot add or delete workflow definitions.
          # Leave this workflow in place and omit the imported test workflow.
          rm -f .github/workflows/test.yml .payload-part-trigger
          rm .payload-part-{0..7}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Import Daily Dynasty application source"
          git push
